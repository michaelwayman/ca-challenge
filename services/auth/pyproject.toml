[project]
name = "reviews-auth"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "shared[wp]>=0.2,<0.3",
    "django>=5.2,<5.3",
    "djangorestframework>=3.16,<3.17",
    "psycopg[binary]>=3.2,<4",
]

[tool.uv]
package = false

[tool.uv.sources]
shared = { workspace = true }

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: needs the wp-db container (make wp-source)"]
