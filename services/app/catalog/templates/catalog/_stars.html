{% if rating is None %}<span class="stars stars--none">No ratings yet</span>{% else %}<span class="stars" role="img" aria-label="Rating: {{ rating|floatformat:1 }} out of 5">{% for star in full %}<span class="stars__star stars__star--full" aria-hidden="true">★</span>{% endfor %}{% for star in empty %}<span class="stars__star stars__star--empty" aria-hidden="true">☆</span>{% endfor %}{% if show_value %}<span class="stars__value" aria-hidden="true">{{ rating|floatformat:1 }}</span>{% endif %}</span>{% endif %}
