{% if rating is None %}<span class="stars none">No ratings yet</span>{% else %}<span class="stars" role="img" aria-label="Rating: {{ rating|floatformat:1 }} out of 5">{% for star in full %}<span class="star-full" aria-hidden="true">★</span>{% endfor %}{% for star in empty %}<span class="star-empty" aria-hidden="true">☆</span>{% endfor %}{% if show_value %}<span class="rating-value" aria-hidden="true">{{ rating|floatformat:1 }}</span>{% endif %}</span>{% endif %}
