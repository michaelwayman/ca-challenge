{% load catalog_extras %}
<article class="card">
  <p class="meta"><a href="{{ review.brand.get_absolute_url }}">{{ review.brand.name }}</a></p>
  <h3><a href="{{ review.get_absolute_url }}">{{ review.title }}</a></h3>
  <p class="rating">{% stars review.rating %}</p>
  <p class="excerpt">{{ review.body|excerpt:24 }}</p>
  <p class="meta">— {% if review.reviewer %}{{ review.reviewer.display_name }}{% endif %}{% if review.reviewer_location %}, {{ review.reviewer_location }}{% endif %}</p>
</article>
