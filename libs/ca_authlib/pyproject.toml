[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ca-authlib"
version = "0.1.0"
description = "Token claims, verification and permission checks shared by the main app and the auth service."
requires-python = ">=3.13"
dependencies = ["pyjwt[crypto]>=2.9"]

[project.optional-dependencies]
# The DRF adapter. The auth service does not need it.
drf = ["djangorestframework>=3.16,<3.17"]

[dependency-groups]
test = ["pytest>=8", "django>=5.2,<5.3", "djangorestframework>=3.16,<3.17"]

[tool.hatch.build.targets.wheel]
packages = ["src/ca_authlib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
